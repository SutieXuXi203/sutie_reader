name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit & security tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
